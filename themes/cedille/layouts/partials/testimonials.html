{{ with .Site.Data.testimonials }}
{{ if .enable }}
<section class="bg-white py-5 border-top">
    <div class="container py-lg-4">
        <div class="text-center mb-5">
            <h2 class="display-6 fw-bold text-dark mb-2">
                {{ .title }}
            </h2>

            {{ with .subtitle }}
            <p class="lead text-muted mx-auto" style="max-width: 650px;">
                {{ . }}
            </p>
            {{ end }}
        </div>

        <!-- testimonials -->
        <div class="row g-4 justify-content-center mb-5">
            {{ range .testimonials }}
            <div class="col-12 col-md-6">
                <div class="card h-100 border-0 bg-light shadow-sm rounded-3 p-4">
                    <div class="card-body p-0 d-flex flex-column">
                        <div class="text-warning fs-3 mb-3">
                            <i class="fa-solid fa-quote-left"></i>
                        </div>
                        <p class="card-text text-secondary fst-italic mb-4 flex-grow-1">
                            « {{ .quote }} »
                        </p>
                        <div class="d-flex align-items-center gap-3 pt-3 border-top">
                            <img src="{{ .image | relURL }}" alt="{{ .name }}" class="rounded-circle border border-warning border-2 flex-shrink-0" width="52" height="52" style="width: 52px; height: 52px; object-fit: cover;" loading="lazy">
                            <div>
                                <h6 class="fw-bold mb-0 text-dark">{{ .name }}</h6>
                                <span class="badge bg-warning text-dark mt-1">
                                    {{ .role }}
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {{ end }}
        </div>

        <!-- partners -->
        {{ with .partners }}
        <div class="card border bg-light rounded-3 p-4 text-center mt-4 shadow-sm">
            <h5 class="fw-bold text-dark mb-1">{{ .title }}</h5>
            <p class="text-muted small mb-4 mx-auto" style="max-width: 600px;">{{ .subtitle }}</p>
            <div class="d-flex flex-wrap align-items-center justify-content-center gap-4 gap-md-5">
                {{ range .items }}
                <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="d-inline-flex align-items-center justify-content-center p-2" title="{{ .name }}">
                    <img src="{{ .logo | relURL }}" alt="{{ .name }}" class="img-fluid" width="120" height="38" style="max-height: 38px; max-width: 120px; object-fit: contain;" loading="lazy">
                </a>
                {{ end }}
            </div>
        </div>
        {{ end }}
    </div>
</section>
{{ end }}
{{ end }}

{{ with .Site.Data.hero }}
{{ if .enable }}
<section class="py-5 text-white position-relative" style="background-color: #080808;">
    <div class="container py-lg-4">
        <div class="row align-items-center g-4 g-lg-5">
            <!-- content -->
            <div class="col-12 col-lg-7 text-center text-lg-start">
                <h1 class="display-5 fw-bold mb-3 text-white">
                    {{ with .content.title }}{{ . }}{{ end }}
                </h1>

                {{ with .content.subtitle }}
                <p class="lead text-muted mb-4 mx-auto mx-lg-0" style="max-width: 580px;">
                    {{ . }}
                </p>
                {{ end }}

                <div class="d-flex flex-wrap gap-3 justify-content-center justify-content-lg-start align-items-center pt-2">
                    <!-- discord link -->
                    {{ with .buttons.discord }}
                    <a href="{{ .url }}" target="_blank" rel="noopener noreferrer" class="btn btn-outline-light btn-lg px-3 d-inline-flex align-items-center" aria-label="Discord" title="Discord">
                        <i class="fa-brands fa-discord me-2"></i>
                        <span>Discord</span>
                    </a>
                    {{ end }}
                    <!-- project link -->
                    {{ with .buttons.projects }}
                    <a href="{{ .url | relURL }}" class="btn btn-warning btn-lg fw-bold px-4 d-inline-flex align-items-center shadow-sm">
                        <span>{{ .text | default "Découvrir nos projets" }}</span>
                        <i class="bi bi-arrow-right ms-2"></i>
                    </a>
                    {{ end }}
                </div>
            </div>

            <!-- logo -->
            <div class="col-12 col-lg-5 text-center">
                <img src="{{ .logoCedille | default "images/cedille-new-logo.png" | relURL }}" alt="Logo CEDILLE" class="img-fluid" width="340" height="340" style="max-height: 340px; max-width: 100%; width: auto; height: auto;" loading="eager">
            </div>
        </div>
    </div>
</section>
{{ end }}
{{ end }}

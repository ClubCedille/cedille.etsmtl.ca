{{- /*
  Reusable page header.

  Params:
    title    (string, required)
    subtitle (string, optional)
*/ -}}
<div class="row mb-4">
    <div class="col-12">
        <h2 class="title-border mb-3"><b>{{ .title }}</b></h2>
        {{ with .subtitle }}
        <p class="lead text-muted mb-0">{{ . }}</p>
        {{ end }}
    </div>
</div>

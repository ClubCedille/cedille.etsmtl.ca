    response: "<p>Absolutely! We welcome students of all programming skill levels, including beginners. It is completely normal to feel overwhelmed at first, especially when starting with little to no experience. At CEDILLE, our primary goal is progressive learning and skill development. We understand that some of our activities may seem intimidating initially.</p><p>Our ultimate goal is to learn and build our skills together. You don't have to contribute to complex projects right away. If you focus on learning step by step with curiosity and dedication, you will steadily reach a point where you can actively contribute to all kinds of exciting projects.</p><p>Every small step counts in your learning journey, and our community is always here to support and guide you.</p>"

subtitle: "Vous avez des questions sur le club?"
questions:
  - id: "faq-1"
    question: "Faut-il avoir de l'expérience en programmation ou DevOps pour rejoindre?"
    answer: "Pas du tout! Nous accueillons tous les étudiants, peu importe leur niveau initial. Que vous soyez débutant curieux ou déjà à l'aise, l'objectif du club est l'apprentissage grâce au mentorat, au pratiques bi-mensuels et aux projets d'équipe."
  - id: "faq-2"
    question: "Combien de temps dois-je y consacrer par semaine?"
    answer: "L'implication est 100% flexible. Vos études et vos examens restent toujours la priorité. Vous participez selon vos disponibilités et selon le temps que vous désirez investir dans les projets."
  - id: "faq-3"
    question: "Le club est-il réservé aux étudiants en génie logiciel et TI?"
    answer: "Non, CEDILLE est ouvert à l'ensemble des départements de l'ÉTS (génie électrique, mécanique, etc.). Toute personne intéréssée à notre club est la bienvenue!"
  - id: "faq-4"
    question: "Nous sommes un club scientifique avec un besoin en particulier, êtes-vous en mesure de nous aider?"
    answer: "Absolument! En plus de nos services cloud gratuits, nous accompagnons les clubs étudiants de l'ÉTS dans leurs défis techniques. Qu'il s'agisse d'un besoin d'infrastructure spécifique ou d'un projet sur mesure, contactez-nous via l'onglet « Services aux clubs » de notre page contact ou sur Discord pour en discuter avec l'équipe."
  - id: "faq-5"
    question: "J'ai une idée de projet, acceptez-vous les propositions?"
    answer: "Absolument! Nous encourageons les initiatives et serions ravis d'écouter votre proposition, surtout si vous collaborez déjà avec nous!"
  - id: "faq-6"
    question: "Quelles sont les démarches pour rejoindre CEDILLE?"
    answer: "Présentez-vous à l'une de nos rencontres hebdomadaires ou lors d'une de nos pratiques bimensuelles. Ensuite, il suffira de remplir notre formulaire de contact ou de nous rejoindre sur Discord, puis de compléter le formulaire d'adhésion afin d'être officiellement reconnu comme membre et obtenir accès au D-2020. Plus de détails <a href='/a-propos'>ici</a>."
  - id: "faq-7"
    question: "CEDILLE est un acronyme?"
    answer: "Oui! CEDILLE signifie Club d'Expérimentation DevOps et d'Intégration de Logiciels Libres de l’ÉTS."

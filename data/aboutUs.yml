enable: true
title: "À propos"
subtitle: "Découvrez notre mission, notre philosophie et les différentes façons de nous rejoindre."

sections:
  - title: "qui-sommes-nous"
    subtitle: "Qui sommes-nous ?"
    icon: "fas fa-circle-info"
    layout: "grid"
    lead: true
    intro: "CEDILLE est un club étudiant de l'[ÉTS](https://www.etsmtl.ca/) axé sur le DevOps et le développement logiciel. Notre plateforme est exploitée *on-premise*, en collaboration avec le [Lan ETS](https://lanets.ca), et repose sur des technologies modernes utilisées en industrie."
    items:
      - title: "Hébergement gratuit pour les clubs"
        text: "Plutôt que chaque club consacre du temps aux mêmes problèmes d'infrastructure, nous centralisons l'hébergement web, le stockage, le SSO et plus — gratuitement — pour que chaque club se concentre sur sa mission principale."
      - title: "Apprentissage par la pratique"
        text: "Chaque déploiement est une opportunité d'apprendre. Kubernetes, GitOps, CI/CD, observabilité — nos membres travaillent avec les mêmes technologies que l'industrie, sur de vrais projets."

  - title: "philosophie"
    subtitle: "Philosophie du club"
    icon: "fas fa-compass"
    layout: "grid"
    compact: true
    intro: "CEDILLE fonctionne comme un collectif technique plutôt qu'une simple équipe d'exécution."
    items:
      - title: "Logiciel libre"
        text: "Toutes nos solutions reposent sur des outils open-source, pertinents sur le marché et audités par la communauté."
      - title: "Git comme source de vérité"
        text: "Chaque déploiement est décrit en code, versionné et reproductible. Infrastructure as Code, pas de changements manuels."
      - title: "No blame"
        text: "Si une erreur se produit, c'est notre système qui l'a permise — pas un individu. On améliore les processus collectivement."
      - title: "Documentation = code"
        text: "Les procédures, guides et décisions techniques sont documentés avec le même soin que le code qu'on écrit."
      - title: "Participation volontaire"
        text: "Aucun minimum d'implication n'est exigé. On apprend ensemble, à des rythmes différents. Les rencontres sont optionnelles."
      - title: "Décisions discutées"
        text: "Les choix techniques sont expliqués, débattus et documentés. On fonctionne comme un collectif, pas une hiérarchie."

  - title: "rencontres"
    subtitle: "Rencontres hebdomadaires"
    icon: "fas fa-calendar-days"
    layout: "grid"
    intro: "Nos rencontres sont ouvertes à tous, aucune expérience requise!"
    note: "Les locaux et les heures sont annoncés avant chaque rencontre. Confirmez sur [Discord](https://discord.gg/kX4rXRTMR6) avant de vous déplacer."
    noteStyle: "secondary"
    items:
      - title: "Scrum hebdomadaire"
        text: "On fait le point sur les projets en cours, on adresse les défis, on passe en revue le backlog et on attribue les tâches."
        badge: "📅 Mardi · 17h30–18h00 · D-3014"
        badgeStyle: "success"
      - title: "Workshop du vendredi"
        text: "Session de collaboration ouverte : les membres s'entraident sur leurs tâches dans une ambiance détendue."
        badge: "📅 Vendredi · 12h30–20h00 · D-2020"
        badgeStyle: "primary"

  - title: "rejoindre"
    subtitle: "Comment rejoindre"
    icon: "fas fa-handshake"
    layout: "ordered"
    intro: "Nous acceptons seulement les étudiants après les avoir rencontrés."
    items:
      - title: "Prenez contact avec nous"
        text: "Rejoignez notre [Discord](https://discord.gg/kX4rXRTMR6), envoyez nous un courriel ou participez à une de nos réunions. C'est la première étape pour rencontrer l'équipe et découvrir nos projets."
      - title: "Remplissez le formulaire sur Monets"
        text: "Une fois votre demande acceptée, remplissez le formulaire d'adhésion officiel sur le portail Monets."
      - title: "Complétez le quiz sur Moodle"
        text: "Le questionnaire d'intégration sera accessible après acceptation. Il vous familiarisera avec nos outils et nos pratiques."

  - title: "ressources"
    subtitle: "Ressources utiles"
    icon: "fas fa-book"
    layout: "links"
    intro: "Notre communication se fait principalement sur [Discord](https://discord.gg/kX4rXRTMR6). Voici les liens essentiels pour vous orienter."
    links:
      - label: "GitHub — ClubCedille"
        url: "https://github.com/ClubCedille"
      - label: "Wiki publique CEDILLE"
        url: "https://cedille.etsmtl.club/s/wiki"
      - label: "Document de vision — lecture essentielle"
        url: "https://cedille.etsmtl.club/s/05b8bdc7-765a-4359-b6a1-0679f98bfca9"

button:
  tagline: "Prêt à embarquer avec CEDILLE?"
